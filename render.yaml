services:
  - type: web
    name: donnar-line-backend-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: LINE_FAKE_MODE
        value: "false"
      - key: STAFF_USERNAME
        value: admin
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: STAFF_PASSWORD_HASH
        sync: false
      - key: LIFF_ID
        sync: false
