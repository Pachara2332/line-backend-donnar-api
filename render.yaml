services:
  - type: web
    name: donnar-line-backend-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: LINE_FAKE_MODE
        value: "false"
      - key: STAFF_USERNAME
        value: admin
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: STAFF_PASSWORD_HASH
        sync: false
      - key: LIFF_ID
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SELLER_NAME
        sync: false
      - key: SELLER_TAX_ID
        sync: false
      - key: SELLER_BRANCH_CODE
        sync: false
      - key: SELLER_ADDRESS
        sync: false
      - key: SELLER_PHONE
        sync: false
      - key: SELLER_EMAIL
        sync: false
      - key: SELLER_WEBSITE
        sync: false
      - key: SELLER_BANK_ACCOUNT
        sync: false
      - key: SELLER_VAT_REGISTERED
        sync: false
